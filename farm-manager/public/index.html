<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Farm Manager</title>
<style>body{font-family:system-ui,Arial;background:#f4f7f4;color:#17321f;margin:0}header{background:#1d5936;color:white;padding:22px}main{max-width:1000px;margin:auto;padding:22px}section{background:white;border:1px solid #dce5dc;border-radius:12px;padding:20px;margin:16px 0}form{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}input,select,button{padding:11px;border:1px solid #aabdab;border-radius:7px;font:inherit}button{background:#1d5936;color:white;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;text-align:left;padding:9px}#message{min-height:24px}h1{margin:0}small{opacity:.8}</style></head>
<body><header><h1>🌱 Farm Manager</h1><small>Multi-farm livestock management • Phase 1</small></header><main>
<p id="message" role="status"></p>
<section><h2>Your farms</h2><form id="farmForm"><input name="name" placeholder="Farm name" required maxlength="120"><input name="location" placeholder="Location"><button>Add farm</button></form><label>Current farm <select id="farmSelect"></select></label></section>
<section><h2>Housing</h2><form id="housingForm"><input name="name" placeholder="Stable / pond / house" required><input name="capacity" type="number" min="0" placeholder="Capacity" required><button>Add housing</button></form><div id="housingList"></div></section>
<section><h2>Register animals</h2><form id="animalForm"><select name="species" id="species"></select><input name="tag" placeholder="Animal tag or batch ID" required><input name="quantity" type="number" min="1" value="1" required><select name="sex"><option value="unknown">Unknown</option><option value="female">Female</option><option value="male">Male</option><option value="mixed">Mixed batch</option></select><select name="housing_id" id="housingSelect"><option value="">No housing</option></select><button>Register</button></form><h3>Animals</h3><div id="animalList"></div><h3>Active animals by species</h3><div id="summary"></div></section>
</main><script src="/app.js"></script></body></html>
